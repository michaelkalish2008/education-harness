[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "education-harness-mcp"
version = "0.1.0"
description = "Core MCP server for the education harness: local tools over the learner's plain files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]
semantic = ["fastembed==0.9.1", "numpy>=1.26"]

[project.scripts]
eh-mcp = "eh_mcp.server:main"
eh-ollama = "eh_mcp.ollama_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eh_mcp = ["programs/*/*.yaml"]
