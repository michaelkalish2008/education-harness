<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning catalog</title>
<style>
:root{--ink:#18302a;--muted:#63716c;--paper:#f7f5ef;--card:#fff;--line:#d8ded8;--green:#315c4c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:28px}header{margin-bottom:20px}h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0}.sub,.meta,.next{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input,select,button{font:inherit;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;color:var(--ink)}input{min-width:240px;flex:1}button{cursor:pointer}button.on{background:var(--green);color:#fff}.analytics{display:grid;grid-template-columns:1.2fr 2fr;gap:14px;margin:18px 0}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.shape{font-size:24px;font-weight:700;margin:5px 0}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:100px 1fr 24px;gap:8px;align-items:center}.track{height:9px;background:#edf0ec;border-radius:10px;overflow:hidden}.fill{display:block;height:100%;background:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{display:grid;gap:10px}.card.archived{opacity:.65}.top{display:flex;justify-content:space-between;gap:8px}.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);font-weight:700}.priority{font-size:12px;background:#eef4f0;border-radius:999px;padding:3px 8px}h2{font-size:20px;line-height:1.2;margin:0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.actions button{font-size:12px;padding:6px 9px}.empty{padding:50px;text-align:center;color:var(--muted)}footer{margin-top:24px;color:var(--muted);font-size:13px}@media(max-width:700px){.app{padding:18px}.analytics{grid-template-columns:1fr}}
</style></head><body><main class="app"><header><div><div class="kind">Education Harness</div><h1>Your learning catalog</h1><div class="sub" id="summary"></div></div></header>
<section class="analytics"><div class="panel"><div class="kind">Portfolio shape</div><div class="shape" id="shape"></div><div class="meta" id="shapeNote"></div><button id="advisor">Ask for optional path ideas</button></div><div class="panel"><div class="kind">Scope right now</div><div class="bars" id="bars"></div></div></section><div class="controls"><input id="q" aria-label="Search" placeholder="Search lessons and trajectories"><select id="kind" aria-label="Type"><option value="">All types</option></select><button class="tab on" data-view="active">Active</button><button class="tab" data-view="archived">Archived</button><button class="tab" data-view="all">All</button></div><section class="grid" id="grid"></section><footer>To save a change, use the copied phrase in your Education Harness chat. The catalog stays local in your learning folder.</footer></main>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script><script>
const D=JSON.parse(document.getElementById('catalog-data').textContent),$=s=>document.querySelector(s);let view='active';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
D.kinds.forEach(k=>$('#kind').insertAdjacentHTML('beforeend',`<option>${esc(k)}</option>`));
$('#summary').textContent=`${D.counts.active} active · ${D.counts.archived} archived`;
$('#shape').textContent=D.analytics.portfolio_shape;$('#shapeNote').textContent=D.analytics.note;
const scope={...D.analytics.kinds,...Object.fromEntries(Object.entries(D.analytics.priorities).map(([k,v])=>['priority: '+k,v]))},mx=Math.max(1,...Object.values(scope));$('#bars').innerHTML=Object.entries(scope).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${100*v/mx}%"></span></span><strong>${v}</strong></div>`).join('');
function command(action,x,value=''){const name=x.entity==='trajectory'?`trajectory ${x.slug}`:x.slug;if(action==='continue')return x.entity==='trajectory'?`Let's go on ${x.slug}.`:`Let's continue ${x.slug}.`;return action==='archive'?`Archive ${name} in my learning catalog.`:action==='restore'?`Restore ${name} in my learning catalog.`:action==='priority'?`Set ${name} to ${value} priority in my learning catalog.`:`Rank ${name} ${value} in my learning catalog.`}
function render(){const q=$('#q').value.toLowerCase(),k=$('#kind').value;const xs=D.items.filter(x=>(view==='all'||(view==='archived')===x.archived)&&(!k||x.kind===k)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#grid').innerHTML=xs.length?xs.map(x=>`<article class="card ${x.archived?'archived':''}" id="${esc(x.id)}"><div class="top"><span class="kind">${esc(x.kind)} · ${esc(x.entity)}</span><span class="priority">${esc(x.priority)}${x.rank<999?' · #'+x.rank:''}</span></div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.progress)}${x.trajectories?.length?' · '+esc(x.trajectories.join(', ')):''}${x.last_active?' · active '+esc(x.last_active):''}</div>${x.next?`<div class="next"><strong>Next:</strong> ${esc(x.next)}</div>`:''}<div class="actions"><button data-copy="${esc(command('continue',x))}">Continue</button><button data-copy="${esc(command(x.archived?'restore':'archive',x))}">${x.archived?'Restore':'Archive'}</button>${D.priorities.map(p=>`<button data-copy="${esc(command('priority',x,p))}">${esc(p)}</button>`).join('')}<button data-copy="${esc(command('rank',x,'first'))}">Rank first</button></div></article>`).join(''):`<div class="empty">No catalog items match this view.</div>`;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied';setTimeout(()=>b.textContent='Copy action',900)})}
$('#q').oninput=render;$('#kind').onchange=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});render();
$('#advisor').onclick=()=>navigator.clipboard.writeText('Ask my academic advisor to review my learning portfolio and suggest possible paths.');
</script></body></html>
