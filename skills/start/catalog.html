<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning catalog</title>
<style>
:root{--ink:#18302a;--muted:#63716c;--paper:#f7f5ef;--card:#fff;--line:#d8ded8;--green:#315c4c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;padding:28px}header{margin-bottom:20px}h1{font-size:clamp(28px,5vw,48px);line-height:1;margin:0}.sub,.meta,.next{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}input,select,button{font:inherit;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;color:var(--ink)}input{min-width:240px;flex:1}button{cursor:pointer}button.on{background:var(--green);color:#fff}.analytics{display:grid;grid-template-columns:1.2fr 2fr;gap:14px;margin:18px 0}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.shape{font-size:24px;font-weight:700;margin:5px 0}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:100px 1fr 24px;gap:8px;align-items:center}.group{margin-top:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.count{background:#eef4f0;border-radius:999px;padding:4px 10px;font-size:13px}.analytics.one{grid-template-columns:1fr}.track{height:9px;background:#edf0ec;border-radius:10px;overflow:hidden}.fill{display:block;height:100%;background:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{display:grid;gap:10px}.card.archived{opacity:.65}.top{display:flex;justify-content:space-between;gap:8px}.kind{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);font-weight:700}.priority{font-size:12px;background:#eef4f0;border-radius:999px;padding:3px 8px}h2{font-size:20px;line-height:1.2;margin:0}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.actions button{font-size:12px;padding:6px 9px}.empty{padding:50px;text-align:center;color:var(--muted)}.stds{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}.std{border:1px solid var(--line);border-radius:8px;padding:2px 7px;background:#f7faf8}.std.rel{border-style:dashed;color:var(--muted)}.std.ahead{opacity:.7}.stdlist{margin:6px 0 0;padding-left:18px;font-size:13px}footer{margin-top:24px;color:var(--muted);font-size:13px}@media(max-width:700px){.app{padding:18px}.analytics{grid-template-columns:1fr}}
</style></head><body><main class="app"><header><div><div class="kind">Education Harness</div><h1>Your learning catalog</h1><div class="sub" id="summary"></div></div></header>
<section class="analytics" id="analytics"></section><div class="controls"><input id="q" aria-label="Search" placeholder="Search lessons and trajectories"><select id="kind" aria-label="Type"></select><button class="tab on" data-view="active">Active</button><button class="tab" data-view="archived">Archived</button><button class="tab" data-view="all">All</button></div><section class="grid" id="grid"></section><footer id="footnote">To save a change, use the copied phrase in your Education Harness chat. The catalog stays local in your learning folder.</footer></main>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script><script>
let D=JSON.parse(document.getElementById('catalog-data').textContent);const $=s=>document.querySelector(s);let view='active';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND_LABEL={'ad-hoc':'ad hoc',developing:'developing',structured:'structured',continuous:'continuous'};
function nonzero(o){return Object.entries(o||{}).filter(([,v])=>v>0)}
function scopePanel(){const a=D.analytics,active=D.counts.active,kinds=nonzero(a.kinds),pris=nonzero(a.priorities);
 if(!active)return'';
 if(active<5)return'';  // the cards already say this; a summary only helps once there is enough to compare
 const mx=Math.max(1,...kinds.map(([,v])=>v),...pris.map(([,v])=>v));
 const rows=xs=>xs.map(([k,v])=>`<div class="bar"><span>${esc(KIND_LABEL[k]||k)}</span><span class="track"><span class="fill" style="width:${100*v/mx}%"></span></span><strong>${v}</strong></div>`).join('');
 return `<div class="panel"><div class="kind">Scope right now</div><div class="group">Type</div><div class="bars">${rows(kinds)}</div><div class="group">Priority</div><div class="bars">${rows(pris)}</div></div>`}
function shapePanel(){const a=D.analytics;if(!a.enough_evidence)return'';return `<div class="panel"><div class="kind">Portfolio shape</div><div class="shape">${esc(a.portfolio_shape)}</div><div class="meta">${esc(a.note)}</div><button id="advisor">Ask for optional path ideas</button></div>`}
const chip=(c,cls)=>typeof c==='string'?`<span class="std ${cls}">${esc(c)}</span>`:`<span class="std ${cls}" title="${esc(c.statement)}">${esc(c.code)}</span>`;
function stdChips(x){const s=x.standards;if(!s||s.loaded===false)return'';const cov=s.covered||[],ah=s.ahead||[];if(!cov.length&&!ah.length)return'';return `<div class="stds">${cov.length?'<strong>Standards touched:</strong>':''}${cov.map(c=>chip(c,'')).join('')}${s.pending_review?`<span class="meta">${s.pending_review} to review</span>`:''}${ah.length?'<span class="meta">ahead:</span>'+ah.map(c=>chip(c,'ahead')).join(''):''}</div>`}
function stdPanel(){const a=D.analytics.standards;if(!a||!a.loaded)return'';const c=a.covered||[];
 if(!c.length&&!a.ahead_count&&!a.pending_review)return `<div class="panel" style="grid-column:1/-1"><div class="kind">Standards</div><div class="meta">No lesson has recorded standards yet. They are recorded in each lesson's standards file during planning and sessions.</div></div>`;
 return `<div class="panel" style="grid-column:1/-1"><div class="kind">Standards your work touches</div>${c.length?`<ul class="stdlist">${c.map(x=>`<li><strong>${esc(x.code)}</strong> ${esc(x.statement)}</li>`).join('')}</ul>`:'<div class="meta">None cited by completed steps yet.</div>'}<div class="meta">${a.ahead_count} aligned to steps ahead · ${a.pending_review} candidates to review. ${esc(a.note)}</div>${a.attribution?`<div class="meta" style="font-size:12px">${esc(a.attribution)}</div>`:''}</div>`}
function command(action,x,value=''){const name=x.entity==='trajectory'?`trajectory ${x.slug}`:x.slug;if(action==='continue')return x.entity==='trajectory'?`Let's go on ${x.slug}.`:`Let's continue ${x.slug}.`;return action==='archive'?`Archive ${name} in my learning catalog.`:action==='restore'?`Restore ${name} in my learning catalog.`:action==='priority'?`Set ${name} to ${value} priority in my learning catalog.`:`Rank ${name} ${value} in my learning catalog.`}
let rpcId=1,hostReady=false;const pending=new Map();
function request(method,params){if(parent===window)return Promise.reject(new Error('No host'));const id=rpcId++;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((res,rej)=>{pending.set(id,{resolve:res,reject:rej});setTimeout(()=>{if(pending.has(id)){pending.delete(id);rej(new Error('No host bridge'))}},1800)})}
async function copyText(t){try{if(navigator.clipboard){await navigator.clipboard.writeText(t);return true}}catch(e){}const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
async function send(text,btn){const label=btn.textContent;if(hostReady){try{await request('ui/message',{role:'user',content:{type:'text',text}});btn.textContent='Sent';setTimeout(()=>btn.textContent=label,900);return}catch(e){}}btn.textContent=await copyText(text)?'Copied':'Copy failed';setTimeout(()=>btn.textContent=label,900)}
function frame(){$('#summary').textContent=`${D.counts.active} active · ${D.counts.archived} archived`;
 const k=$('#kind');k.innerHTML='<option value="">All types</option>'+D.kinds.map(x=>`<option value="${esc(x)}">${esc(KIND_LABEL[x]||x)}</option>`).join('');
 const panels=shapePanel()+scopePanel(),el=$('#analytics');el.innerHTML=panels+stdPanel();el.classList.toggle('one',!shapePanel());
 const adv=$('#advisor');if(adv)adv.onclick=()=>send('Ask my academic advisor to review my learning portfolio and suggest possible paths.',adv)}
function render(){const q=$('#q').value.toLowerCase(),k=$('#kind').value;const xs=D.items.filter(x=>(view==='all'||(view==='archived')===x.archived)&&(!k||x.kind===k)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#grid').innerHTML=xs.length?xs.map(x=>`<article class="card ${x.archived?'archived':''}" id="${esc(x.id)}"><div class="top"><span class="kind">${esc(KIND_LABEL[x.kind]||x.kind)} · ${esc(x.entity)}</span><span class="priority">${esc(x.priority)}${x.rank<999?' · #'+x.rank:''}</span></div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.progress)}${x.trajectories?.length?' · '+esc(x.trajectories.join(', ')):''}${x.last_active?' · active '+esc(x.last_active):''}</div>${x.next?`<div class="next"><strong>Next:</strong> ${esc(x.next)}</div>`:''}${stdChips(x)}<div class="actions"><button data-copy="${esc(command('continue',x))}">Continue</button><button data-copy="${esc(command(x.archived?'restore':'archive',x))}">${x.archived?'Restore':'Archive'}</button>${D.priorities.filter(p=>p!==x.priority).map(p=>`<button data-copy="${esc(command('priority',x,p))}">${esc(p)}</button>`).join('')}<button data-copy="${esc(command('rank',x,'first'))}">Rank first</button></div></article>`).join(''):`<div class="empty">No catalog items match this view.</div>`;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>send(b.dataset.copy,b))}
function load(d){if(d&&Array.isArray(d.items)){D=d;frame();render()}}
addEventListener('message',e=>{const m=e.data||{};if(m.id&&!m.method&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result'){const s=m.params?.structuredContent||{},r=s.result||s;load(r.data||r)}});
(async()=>{try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'education-harness-catalog',version:'0.13.0'},appCapabilities:{}});hostReady=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');$('#footnote').textContent='Buttons send the request to your Education Harness chat. The catalog stays local in your learning folder.'}catch(e){hostReady=false}})();
$('#q').oninput=render;$('#kind').onchange=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});frame();render();
</script></body></html>
